<div class="user-profile-container">
  <div class="user-details">
    <p class="name">{{name()}}</p>
    <p class="email">{{email()}}</p>
  </div>
  <p class="joined-details">{{joinedAgo()}}</p>
  <div class="message-button">
    <button (click)="addUserToContact(userId())">Message</button>
  </div>
</div>
